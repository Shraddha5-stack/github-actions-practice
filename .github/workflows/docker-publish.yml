name: Docker CI/CD

on:
  push:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/github-actions-docker:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/github-actions-docker:sha-${GITHUB_SHA::7} .

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-docker:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/github-actions-docker:sha-${GITHUB_SHA::7}
