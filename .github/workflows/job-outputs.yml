name: Job Outputs

on:
  push:

jobs:
  generate-date:
    runs-on: ubuntu-latest

    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
      - name: Get Today's Date
        id: date
        run: |
          echo "today=$(date)" >> "$GITHUB_OUTPUT"

  print-date:
    needs: generate-date
    runs-on: ubuntu-latest

    steps:
      - name: Print Date
        run: |
          echo "Today's date is: ${{ needs.generate-date.outputs.today }}"
