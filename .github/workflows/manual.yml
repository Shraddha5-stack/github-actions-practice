name: Manual Workflow

on:
  workflow_dispatch:

jobs:
  manual-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Print Message
        run: echo "This workflow was triggered manually."

      - name: Show Date
        run: date

      - name: Show Branch
        run: echo "Branch: $GITHUB_REF_NAME"
