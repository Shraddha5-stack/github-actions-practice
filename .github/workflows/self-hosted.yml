name: Self Hosted Runner

on:
  workflow_dispatch:

jobs:
  self-hosted-job:
    runs-on: self-hosted

    steps:
      - name: Print Hostname
        run: hostname

      - name: Print Working Directory
        run: pwd

      - name: Create File
        run: |
          echo "Hello from my self-hosted runner!" > runner-test.txt

      - name: Verify File
        run: ls -l runner-test.txt
