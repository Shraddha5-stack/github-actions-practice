name: Docs Ignore Test

on:
  push:
    branches:
      - main
      - 'release/*'
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  docs-ignore-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Trigger Information
        run: |
          echo "Workflow triggered!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run Check
        run: |
          echo "Changes include files other than documentation."
