name: GitHub Hosted Runners

on:
  push:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Print Runner Information
        run: |
          echo "Operating System: $RUNNER_OS"
          hostname
          whoami

  windows:
    runs-on: windows-latest
    steps:
      - name: Print Runner Information
        shell: pwsh
        run: |
          Write-Host "Operating System: $env:RUNNER_OS"
          hostname
          whoami

  macos:
    runs-on: macos-latest
    steps:
      - name: Print Runner Information
        run: |
          echo "Operating System: $RUNNER_OS"
          hostname
          whoami
