name: Deploy After Tests

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deployment
        run: |
          echo "Tests completed successfully."
          echo "Starting deployment..."
          echo "Deployment completed successfully!"
